name: Update bathrooms

on:
  workflow_dispatch:
  push:
    paths:
      - build.py
      - pages.py
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          PYTHONUNBUFFERED: "1"
      - if: always()
        run: |
          git config user.name "laloo-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update bathrooms and city pages"
          git pull --rebase -X theirs || true
          git push
