

name: Update bathrooms
 
on:
  workflow_dispatch:
  push:
    paths:
      - build.py
  schedule:
    - cron: "0 10 * * 1"
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "laloo-bot"
          git config user.email "actions@github.com"
          git add toilets.json
          git diff --cached --quiet && exit 0
          git commit -m "Update bathrooms"
          git push
 
