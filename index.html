let mode = "sb";               // "sb" = Supabase, "json" = yedek toilets.json
const tiles = new Set(), seenShops = new Set();

const dirLink = (lat,lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;

// ================= SUPABASE =================
async function sb(path){
  const r = await fetch(SB_URL + "/rest/v1/" + path, { headers:{ apikey:SB_KEY } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ================= ÖLÇÜM =================
// Rastgele cihaz kimliği. İsim, e-posta, konum kaydedilmez.
const DEVICE = (() => {
  const make = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
  try{
    let d = localStorage.getItem("laloo_device");
    if (!d){ d = make(); localStorage.setItem("laloo_device", d); }
    return d;
  }catch(e){ return make(); }
})();
// Nereden geldi: laloo.org/?ref=qr gibi linkler, yoksa gelen site, yoksa "direct"
const REF = (() => {
  const q = new URLSearchParams(location.search);
  let r = q.get("ref") || q.get("utm_source");
  if (!r && document.referrer){
    try{ const h = new URL(document.referrer).hostname; if (h !== location.hostname) r = h.replace(/^www\./, ""); }catch(e){}
  }
  return (r || "direct").slice(0, 100);
})();
function cityAt(lat, lng){
  const c = cities.find(c => lat >= c.min_lat && lat <= c.max_lat && lng >= c.min_lng && lng <= c.max_lng);
  return c ? c.id : null;
}
// Tanıtım sayfasındaki telefon önizlemesi: laloo.org/?embed=1 ölçüme sayılmaz, konum istemez
const EMBED = new URLSearchParams(location.search).has("embed");
function track(type, o = {}){
  if (EMBED) return;
  try{ if (localStorage.getItem("laloo_notrack")) return; }catch(e){}   // yönetici cihazları sayılmaz
  const ll = myLL || [map.getCenter().lat, map.getCenter().lng];
  const body = { device:DEVICE, type, ref:REF, city:cityAt(ll[0], ll[1]),
                 target: o.target != null ? String(o.target).slice(0, 100) : null, business_id: o.biz || null };
  if (o.place) body.place_id = o.place;
  try{
    fetch(SB_URL + "/rest/v1/events", { method:"POST", keepalive:true,
      headers:{ apikey:SB_KEY, "Content-Type":"application/json", Prefer:"return=minimal" },
      body: JSON.stringify(body) }).catch(() => {});
  }catch(e){}
}
window.track = track;

// ================= HARİTA ÜZERİNDE YOL TARİFİ =================
let routeLine = null;
function clearRoute(){ if (routeLine){ map.removeLayer(routeLine); routeLine = null; } say(""); }
window.route = async (lat, lng, target, biz) => {
  track("route", { target, biz }); setTimeout(nudge, 8000);
  if (!myLL){ say(tx("allowRoute")); locate(); return; }
  map.closePopup(); say(tx("finding"));
  try{
    const u = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${myLL[1]},${myLL[0]};${lng},${lat}?overview=full&geometries=geojson`;
    const d = await (await fetch(u)).json();
    const r = d.routes[0];
    clearRoute();
    routeLine = L.geoJSON(r.geometry, { style:{ color:"#1c4fa0", weight:6, opacity:.85, dashArray:"1 10", lineCap:"round" } }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding:[40,40] });
    const min = Math.max(1, Math.round(r.duration/60)), m = Math.round(r.distance);
    say(`🚶 ${min} ${tx("min")} · ${m < 1000 ? m+" m" : (m/1000).toFixed(1)+" km"}  ✕`);
  }catch(e){ say(""); window.open(dirLink(lat,lng), "_blank"); }
};
function actsHtml(lat, lng, target, biz){
  const t = target != null ? `'${esc(target)}'` : "null", b = biz ? `'${esc(biz)}'` : "null";
  return `<div class="acts"><button class="go" onclick="route(${lat},${lng},${t},${b})">${tx("route")}</button>
    <a href="${dirLink(lat,lng)}" target="_blank" rel="noopener" onclick="track('route',{target:${t},biz:${b}})">${tx("gmaps")}</a></div>`;
}
window.copyCode = (i) => {
  const s = shops[i]; if (!s) return;
  try{ navigator.clipboard.writeText(s.promo_code); }catch(e){}
  track("code_copy", { biz:s.id }); setTimeout(nudge, 4000);
  say(tx("copied")); setTimeout(() => { if (!routeLine) say(""); }, 2500);
};

// ================= POPUP'LAR =================
// Sahibinin (belediye / işletme) girdiği durum: geçici kapalı, belediye onaylı
function stateTags(p){
  return (p.status === "closed" ? `<span class="tag shut">${esc(tx("closed"))}</span>` : "") +
         (p.verified ? `<span class="tag verif">${esc(tx("verif"))}</span>` : "") +
         (p.status === "closed" && p.status_note ? `<p class="shutnote">${esc(p.status_note)}</p>` : "");
}
const placeClick = p => { if (typeof p.id === "number") track("place_click", { place:p.id }); };
function tipPopup(t){
  const loc = (t.i18n && t.i18n[LANG]) || {}, info = loc.info || t.info, hours = loc.hours || t.hours;
  const cls = t.fee === "Free" ? "free" : t.fee === "Customers" ? "cust" : "";
  return `<div class="tip"><b>⭐ ${esc(t.name)}</b>${stateTags(t)}
    ${t.fee ? `<span class="tag ${cls}">${esc(tx(t.fee))}</span>` : ""}${hours ? `<span class="tag">${esc(hours)}</span>` : ""}${t.area ? `<span class="tag">${esc(t.area)}</span>` : ""}
    <p>${esc(info)}</p>${actsHtml(t.lat, t.lng, t.id)}</div>`;
}
function shopPopup(s, i){
  const web = /^https?:\/\//.test(s.website || "") ? s.website : "";
  return `<div class="ad"><b>${SHOP_ICONS[s.category] || "🛍️"} ${esc(s.name)}</b>
    <span class="tag">${tx("local")}</span>${s.hours ? `<span class="tag">${esc(s.hours)}</span>` : ""}
    <p>${esc(s.blurb)}${s.address ? "<br><small>" + esc(s.address) + "</small>" : ""}</p>
    ${s.promo_code ? `<button class="code" onclick="copyCode(${i})">${tx("code")} ${esc(s.promo_code)}</button>` : ""}
    ${actsHtml(s.lat, s.lng, null, s.id)}
    ${web ? `<div class="acts"><a href="${esc(web)}" target="_blank" rel="noopener" onclick="track('website',{biz:'${esc(s.id)}'})">${tx("web")}</a></div>` : ""}</div>`;
}

// ================= ÇİZİM =================
function draw(){
  layer.clearLayers();
  const b = map.getBounds().pad(0.2), view = map.getBounds();
  let n = 0;
  if (filter === "all" || filter === "tip"){
    tips.forEach(t => {
      if (!b.contains([t.lat, t.lng])) return;
      n++;
      L.marker([t.lat, t.lng], { icon: L.divIcon({ html:"⭐", className: t.status === "closed" ? "loo shut" : "loo", iconSize:[28,28] }), zIndexOffset:500 })
        .addTo(layer).bindPopup(() => { placeClick(t); return tipPopup(t); });
    });
  }
  // İşletmeler her filtrede her zaman görünür
  shops.forEach((sp, i) => {
    if (!b.contains([sp.lat, sp.lng])) return;
    if (view.contains([sp.lat, sp.lng]) && !seenShops.has(sp.id)){ seenShops.add(sp.id); track("pin_view", { biz:sp.id }); }
    L.marker([sp.lat, sp.lng], { icon: L.divIcon({ html:`<div class="shop">${SHOP_ICONS[sp.category] || "🛍️"}</div>`, className:"", iconSize:[34,34], iconAnchor:[17,17] }), zIndexOffset:800 })
      .addTo(layer).bindPopup(() => { track("pin_click", { biz:sp.id }); return shopPopup(sp, i); });
  });
  if (filter !== "tip"){
    if (map.getZoom() < 13){ if (!routeLine) say(tx("zoom")); return; }
    toilets.forEach(p => {
      if (filter !== "all" && p.kind !== filter) return;
      if (!b.contains([p.lat, p.lng])) return;
      n++;
      L.marker([p.lat, p.lng], { icon: L.divIcon({ html: p.kind === "public" ? "🚻" : "☕", className: p.status === "closed" ? "loo shut" : "loo", iconSize:[26,26] }) })
        .addTo(layer)
        .bindPopup(() => { placeClick(p); return `<b>${esc(trName(p.name))}</b>${stateTags(p)}${p.info ? "<br>" + esc(trInfo(p.info)) : ""}${actsHtml(p.lat, p.lng, p.id)}`; });
    });
  }
  if (routeLine) return;
  if (filter === "tip" && !n) say(tx("noTips"));
  else say(n ? "" : tx("noBath"));
}

// ================= VERİ =================
// Tuvaletler ekrandaki bölgeye göre 0.1 derecelik karelerle iner (dünya ölçeği için)
const T = 0.1;
async function loadArea(){
  if (mode !== "sb" || map.getZoom() < 13) return;
  const b = map.getBounds(), need = [];
  for (let y = Math.floor(b.getSouth()/T); y <= Math.floor(b.getNorth()/T); y++)
    for (let x = Math.floor(b.getWest()/T); x <= Math.floor(b.getEast()/T); x++){
      const k = y + ":" + x;
      if (!tiles.has(k)){ tiles.add(k); need.push([y, x]); }
    }
  if (!need.length) return;
  if (!toilets.length) say(tx("loadingB"));
  try{
    const res = await Promise.all(need.map(([y, x]) => sb(
      `places?select=id,kind,name,info,lat,lng,status,status_note,verified&kind=neq.tip` +
      `&lat=gte.${(y*T).toFixed(2)}&lat=lt.${((y+1)*T).toFixed(2)}` +
      `&lng=gte.${(x*T).toFixed(2)}&lng=lt.${((x+1)*T).toFixed(2)}&limit=1000`)));
    res.forEach((r, i) => { if (r.length) toilets.push(...r); else liveTile(...need[i]); });
    draw();
  }catch(e){
    need.forEach(([y, x]) => tiles.delete(y + ":" + x));
    say(tx("loadFail"));
  }
}

// Listede olmayan bir yer: o karenin tuvaletlerini anında OpenStreetMap'ten çek (dünyanın her yeri)
async function liveTile(y, x){
  const b = [(y*T).toFixed(2), (x*T).toFixed(2), ((y+1)*T).toFixed(2), ((x+1)*T).toFixed(2)].join(",");
  const q = `[out:json][timeout:25];(nwr["amenity"="toilets"](${b});nwr["toilets"="yes"](${b}););out center tags 500;`;
  try{
    const r = await fetch("https://overpass-api.de/api/interpreter", { method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:"data=" + encodeURIComponent(q) });
    const d = await r.json();
    d.elements.forEach(el => {
      const t = el.tags || {}, lat = el.lat ?? (el.center && el.center.lat), lng = el.lon ?? (el.center && el.center.lon);
      if (lat == null) return;
      const pub = t.amenity === "toilets";
      if (pub && (t.access === "private" || t.access === "no")) return;
      if (!pub && (t.toilets === "no" || t["toilets:access"] === "private")) return;
      const info = pub ? [t.fee === "no" ? "Free" : t.fee === "yes" ? "Paid" : "", t.access === "customers" ? "Customers only" : "", t.opening_hours || ""]
                       : ["Ask inside, usually for customers", t.opening_hours || ""];
      toilets.push({ id:"osm" + el.id, lat, lng, kind: pub ? "public" : "cafe",
        name: t.name || t.brand || (pub ? "Public restroom" : "Restroom"), info: info.filter(Boolean).join(", ") });
    });
    draw();
  }catch(e){}
}

// Yedek: Supabase'de henüz OSM verisi yoksa ya da ulaşılamazsa eski dosya
async function loadJson(){
  mode = "json";
  try{
    const res = await fetch("toilets.json?d=" + new Date().toISOString().slice(0,10));
    if (!res.ok) throw new Error(res.status);
    toilets = (await res.json()).map(p => ({ lat:p.a, lng:p.o, kind:p.k === "place" ? "cafe" : p.k, name:p.n, info:p.i }));
    draw();
  }catch(e){ say(tx("loadFail")); }
}

async function init(){
  say(tx("loading"));
  try{
    const [c, t, s, osm] = await Promise.all([
      sb("cities?select=id,min_lat,min_lng,max_lat,max_lng"),
      sb("places?select=id,name,info,area,fee,hours,lat,lng,i18n,status,status_note,verified&kind=eq.tip"),
      sb("businesses_public?select=*"),
      sb("places?select=id&source=eq.osm&limit=1"),
    ]);
    cities = c; tips = t; shops = s;
    draw();
    if (osm.length) loadArea(); else await loadJson();
  }catch(e){
    await loadJson();
  }
  // Ziyaret kaydı: konum gelince ya da en geç 4 saniye sonra, bir kez
  let sent = false;
  const visit = () => { if (!sent){ sent = true; track("visit"); } };
  if (myLL) visit(); else { window._visit = visit; setTimeout(visit, 4000); }
}

// ================= KONUM =================
function showMe(p){
  myLL = [p.coords.latitude, p.coords.longitude];
  if (!me) me = L.marker(myLL, { icon: L.divIcon({ className:"", html:'<div class="me"></div>', iconSize:[22,22], iconAnchor:[11,11] }), zIndexOffset:1000 }).addTo(map);
  else me.setLatLng(myLL);
  if (window._visit){ window._visit(); window._visit = null; }
  if (!centered){ centered = true; map.setView(myLL, 16); }
}
function locate(){
  if (!navigator.geolocation){ say(tx("noLoc")); return; }
  if (myLL){ map.setView(myLL, 16); return; }
  navigator.geolocation.watchPosition(showMe,
    () => say(tx("allowLoc")),
    { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}

document.querySelectorAll(".bar button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".bar button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on"); filter = btn.dataset.f; draw();
});
document.getElementById("locate").onclick = () => { track("near_me"); locate(); };
map.on("moveend", () => { draw(); loadArea(); });
msg.onclick = () => { if (routeLine) clearRoute(); else if (!toilets.length) init(); };

// ================= ARAMA =================
const qi = document.getElementById("q"), qr = document.getElementById("qres");
let qTimer = null, qAbort = null, qHits = [];
function pickPlace(f){
  const p = f.properties, [lng, lat] = f.geometry.coordinates;
  qr.hidden = true; qi.value = p.name || ""; qi.blur(); centered = true;
  if (p.extent){ map.fitBounds([[p.extent[1], p.extent[0]], [p.extent[3], p.extent[2]]]); if (map.getZoom() < 13) map.setZoom(13); }
  else map.setView([lat, lng], ["city", "town", "village", "district"].includes(p.type) ? 13 : 16);
  track("search", { target:(p.city || p.name || "").slice(0, 100) });
}
async function searchPlaces(v){
  try{
    if (qAbort) qAbort.abort();
    qAbort = new AbortController();
    const lang = ["en", "de", "fr", "it"].includes(LANG) ? LANG : "en", c = map.getCenter();
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(v)}&limit=6&lang=${lang}&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}`, { signal:qAbort.signal });
    qHits = (await r.json()).features || [];
    qr.innerHTML = qHits.length ? qHits.map((f, i) => {
      const p = f.properties, sub = [p.city && p.city !== p.name ? p.city : "", p.state, p.country].filter(Boolean).join(", ");
      return `<button type="button" data-k="${i}"><b>${esc(p.name || p.street || "")}</b><small>${esc(sub)}</small></button>`;
    }).join("") : `<div class="none">${esc(tx("noResults"))}</div>`;
    qr.hidden = false;
    qr.querySelectorAll("button").forEach(b => b.onclick = () => pickPlace(qHits[+b.dataset.k]));
  }catch(e){}
}
qi.oninput = () => {
  clearTimeout(qTimer);
  const v = qi.value.trim();
  if (v.length < 3){ qr.hidden = true; return; }
  qTimer = setTimeout(() => searchPlaces(v), 350);
};
qi.onkeydown = e => { if (e.key === "Enter" && qHits.length){ e.preventDefault(); pickPlace(qHits[0]); } };
map.on("click", () => { qr.hidden = true; });

// ================= ÖNERİ FORMU VE GİZLİLİK =================
const addSheet = document.getElementById("addsheet"), privSheet = document.getElementById("privsheet"), sf = document.getElementById("sf");
function openSheet(el){ el.classList.add("on"); }
document.querySelectorAll(".sheet").forEach(sh => {
  sh.addEventListener("click", e => { if (e.target === sh || e.target.hasAttribute("data-close")) sh.classList.remove("on"); });
});
document.getElementById("contact").onclick = e => {
  e.preventDefault();
  sf.reset(); sf.querySelector("#sfmsg").hidden = true; sf.querySelector(".go").disabled = false;
  openSheet(addSheet);
};
window.openPriv = () => { openSheet(privSheet); return false; };
map.attributionControl.setPrefix(`<a href="#" onclick="return openPriv()">${esc(tx("privacy"))}</a> · <a href="https://www.trustpilot.com/review/laloo.org" target="_blank" rel="noopener" onclick="track('review_click')">★ ${esc(tx("rev"))}</a>`);
sf.useloc.onchange = () => { if (sf.useloc.checked && !myLL) locate(); };
sf.onsubmit = async e => {
  e.preventDefault();
  const msgEl = sf.querySelector("#sfmsg"), btn = sf.querySelector(".go");
  const done = t => { msgEl.textContent = t; msgEl.hidden = false; };
  if (sf.website.value){ done(tx("thanks")); return; }              // bot tuzağı
  const day = new Date().toISOString().slice(0, 10);
  let cnt = { d:day, n:0 };
  try{ const c = JSON.parse(localStorage.getItem("laloo_sugg") || "null"); if (c && c.d === day) cnt = c; }catch(err){}
  if (cnt.n >= 5){ done(tx("toomany")); return; }
  const useLoc = sf.useloc.checked && myLL;
  const ll = useLoc ? myLL : [map.getCenter().lat, map.getCenter().lng];
  const body = { name:sf.name.value.trim().slice(0, 120), address:sf.address.value.trim().slice(0, 200) || null,
    note:sf.note.value.trim().slice(0, 500) || null, city:cityAt(ll[0], ll[1]), source:"form",
    lat: useLoc ? +myLL[0].toFixed(6) : null, lng: useLoc ? +myLL[1].toFixed(6) : null };
  if (body.name.length < 2) return;
  btn.disabled = true;
  try{
    const r = await fetch(SB_URL + "/rest/v1/suggestions", { method:"POST",
      headers:{ apikey:SB_KEY, "Content-Type":"application/json", Prefer:"return=minimal" }, body:JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    cnt.n++; try{ localStorage.setItem("laloo_sugg", JSON.stringify(cnt)); }catch(err){}
    done(tx("thanks")); sf.name.value = ""; sf.address.value = ""; sf.note.value = "";
  }catch(err){ done(tx("fail")); btn.disabled = false; }
};

// ================= ANA EKRANA EKLE (PWA) =================
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferred = null, nudged = false;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
function dismissedRecently(){
  try{ return Date.now() - (+localStorage.getItem("laloo_inst_x") || 0) < 14 * 864e5; }catch(e){ return false; }
}
function nudge(){
  if (EMBED || nudged || standalone || dismissedRecently()) return;
  if (!deferred && !isIOS) return;           // tarayıcı desteklemiyorsa gösterme
  nudged = true;
  if (isIOS){
    document.getElementById("insttxt").textContent = tx("inst_ios");
    document.getElementById("instbtn").style.display = "none";
  }
  document.getElementById("install").style.display = "flex";
}
function closeInstall(){
  document.getElementById("install").style.display = "none";
  try{ localStorage.setItem("laloo_inst_x", Date.now()); }catch(e){}
}
document.getElementById("instx").onclick = closeInstall;
document.getElementById("instbtn").onclick = async () => {
  if (!deferred) return;
  deferred.prompt();
  const r = await deferred.userChoice.catch(() => ({}));
  deferred = null;
  document.getElementById("install").style.display = "none";
  if (r && r.outcome === "dismissed"){ try{ localStorage.setItem("laloo_inst_x", Date.now()); }catch(e){} }
};
// Birkaç şeye baktıktan sonra da nazikçe sor
setTimeout(nudge, 25000);

// Şehir sayfalarından gelen link: laloo.org/?at=enlem,boylam,zoom haritayı orada açar
(() => {
  const at = (new URLSearchParams(location.search).get("at") || "").split(",").map(Number);
  if (at.length >= 2 && at.every(isFinite) && Math.abs(at[0]) <= 90 && Math.abs(at[1]) <= 180){
    map.setView([at[0], at[1]], Math.min(Math.max(at[2] || 14, 3), 18)); centered = true;
  }
})();
if (!EMBED) locate();
init();
