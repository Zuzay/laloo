<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA Loo · Find the nearest bathroom in Los Angeles</title>
<meta name="description" content="A simple map of public bathrooms in Los Angeles.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚻</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{
    background:#1c4fa0;color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header h1{margin:0;font-size:16px;font-weight:700;line-height:1.25}
  header h1 span{display:block;font-weight:400;font-size:13px;opacity:.85}
  #locate{
    flex:none;background:#fff;color:#1c4fa0;border:0;border-radius:8px;
    font:inherit;font-weight:700;font-size:14px;padding:9px 12px;cursor:pointer;
  }
  #map{flex:1;min-height:0}
  #msg{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
    background:#fff;color:#10223d;padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:1000;white-space:nowrap;display:none;
  }
  .loo{font-size:24px;line-height:26px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
</style>
</head>
<body>
<header>
  <h1>LA Loo<span>Find the nearest bathroom in Los Angeles</span></h1>
  <button id="locate">📍 Near me</button>
</header>
<div id="map"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Tüm LA bölgesi (Malibu'dan Pasadena/Long Beach'e kadar)
const LA_BBOX = "33.70,-118.70,34.35,-117.90";
const CACHE_KEY = "laloo-toilets-v1";
const CACHE_HOURS = 24;
const SERVERS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];

const msg = document.getElementById("msg");
function say(t){ msg.textContent = t; msg.style.display = t ? "block" : "none"; }

const map = L.map("map").setView([33.9850, -118.4695], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors"
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let toilets = [];
let me = null;
let loading = false;

function dirLink(lat, lng){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
}

function parse(data){
  return data.elements.map(e => {
    const t = e.tags || {};
    if (t.access === "private" || t.access === "no") return null;
    const lat = e.lat ?? e.center?.lat, lng = e.lon ?? e.center?.lon;
    if (lat == null) return null;
    return {
      lat, lng,
      name: t.name || t.operator || "Public restroom",
      info: [
        t.fee === "no" ? "Free" : t.fee === "yes" ? "Paid" : "",
        t.access === "customers" ? "Customers only" : "",
        t.opening_hours || ""
      ].filter(Boolean).join(", ")
    };
  }).filter(Boolean);
}

// Sadece ekranda görünenleri çiz, telefon kasmasın
function draw(){
  layer.clearLayers();
  if (!toilets.length) return;
  if (map.getZoom() < 12){ say("Zoom in to see bathrooms"); return; }
  const b = map.getBounds().pad(0.2);
  let n = 0;
  toilets.forEach(p => {
    if (!b.contains([p.lat, p.lng])) return;
    n++;
    L.marker([p.lat, p.lng], { icon: L.divIcon({ html:"🚻", className:"loo", iconSize:[26,26] }) })
      .addTo(layer)
      .bindPopup(`<b>${p.name}</b>${p.info ? "<br>"+p.info : ""}<br><a href="${dirLink(p.lat,p.lng)}" target="_blank" rel="noopener">Walk me there</a>`);
  });
  say(n ? "" : "No bathrooms in this area");
}

async function fetchAll(){
  const q = `[out:json][timeout:60];(node["amenity"="toilets"](${LA_BBOX});way["amenity"="toilets"](${LA_BBOX}););out center tags;`;
  for (const s of SERVERS){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 45000);
      const res = await fetch(s, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(q),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (res.ok) return await res.json();
    }catch(e){ /* sıradaki sunucu */ }
  }
  throw new Error("no server");
}

async function load(){
  if (loading) return;
  // Önce telefondaki kayda bak
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < CACHE_HOURS * 3600e3 && c.d.length){
      toilets = c.d; draw(); return;
    }
  }catch(e){}
  loading = true;
  say("Loading bathrooms…");
  try{
    toilets = parse(await fetchAll());
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: toilets })); }catch(e){}
    draw();
  }catch(e){
    say("Couldn't load bathrooms, tap to retry");
  }
  loading = false;
}

map.on("moveend", draw);
msg.onclick = () => { if (!toilets.length) load(); };
load();

document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation){ say("Location isn't available"); return; }
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (me) me.setLatLng(ll);
    else me = L.circleMarker(ll, { radius:8, color:"#fff", weight:3, fillColor:"#1c4fa0", fillOpacity:1 }).addTo(map);
    map.setView(ll, 16);
  }, () => say("Allow location to see bathrooms near you"), { enableHighAccuracy:true, timeout:12000 });
};
</script>
</body>
</html>
