<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA Loo · Find the nearest bathroom in Los Angeles</title>
<meta name="description" content="A simple map of bathrooms in Los Angeles: public restrooms, cafés and restaurants.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚻</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{
    background:#1c4fa0;color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header h1{margin:0;font-size:16px;font-weight:700;line-height:1.25}
  header h1 span{display:block;font-weight:400;font-size:13px;opacity:.85}
  #locate{
    flex:none;background:#fff;color:#1c4fa0;border:0;border-radius:8px;
    font:inherit;font-weight:700;font-size:14px;padding:9px 12px;cursor:pointer;
  }
  .bar{display:flex;gap:6px;padding:8px 10px;background:#eef3fa;border-bottom:1px solid #d3dae3}
  .bar button{
    flex:1;border:1px solid #c5d0de;background:#fff;color:#10223d;border-radius:18px;
    font:inherit;font-size:13px;padding:6px 8px;cursor:pointer;
  }
  .bar button.on{background:#1c4fa0;color:#fff;border-color:#1c4fa0}
  #map{flex:1;min-height:0}
  #msg{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
    background:#fff;color:#10223d;padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:1000;white-space:nowrap;display:none;
  }
  .loo{font-size:22px;line-height:26px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .me{
    width:16px;height:16px;border-radius:50%;background:#1c7cf0;border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(28,124,240,.25),0 1px 4px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<header>
  <h1>LA Loo<span>Find the nearest bathroom in Los Angeles</span></h1>
  <button id="locate">📍 Near me</button>
</header>
<div class="bar">
  <button data-f="all" class="on">All</button>
  <button data-f="public">🚻 Public</button>
  <button data-f="place">☕ Cafés & food</button>
</div>
<div id="map"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

const msg = document.getElementById("msg");
function say(t){ msg.textContent = t; msg.style.display = t ? "block" : "none"; }

const map = L.map("map").setView([33.9850, -118.4695], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors"
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let toilets = [], filter = "all", me = null, myLL = null, centered = false, loading = false;

const dirLink = (lat,lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;

function draw(){
  layer.clearLayers();
  if (!toilets.length) return;
  if (map.getZoom() < 13){ say("Zoom in to see bathrooms"); return; }
  const b = map.getBounds().pad(0.2);
  let n = 0;
  toilets.forEach(p => {
    if (filter !== "all" && p.kind !== filter) return;
    if (!b.contains([p.lat, p.lng])) return;
    n++;
    L.marker([p.lat, p.lng], { icon: L.divIcon({ html: p.kind === "public" ? "🚻" : "☕", className:"loo", iconSize:[26,26] }) })
      .addTo(layer)
      .bindPopup(`<b>${p.name}</b>${p.info ? "<br>"+p.info : ""}<br><a href="${dirLink(p.lat,p.lng)}" target="_blank" rel="noopener">Walk me there</a>`);
  });
  say(n ? "" : "No bathrooms in this area");
}

async function load(){
  if (loading) return;
  loading = true;
  say("Loading bathrooms…");
  try{
    // GitHub her hafta güncelliyor, tarayıcı eski dosyayı tutmasın diye günlük parametre
    const res = await fetch("toilets.json?d=" + new Date().toISOString().slice(0,10));
    if (!res.ok) throw new Error(res.status);
    toilets = (await res.json()).map(p => ({ lat:p.a, lng:p.o, kind:p.k, name:p.n, info:p.i }));
    draw();
  }catch(e){ say("Couldn't load bathrooms, tap to retry"); }
  loading = false;
}

// Konum: açılışta otomatik iste, sonra canlı takip et
function showMe(p){
  myLL = [p.coords.latitude, p.coords.longitude];
  if (!me) me = L.marker(myLL, { icon: L.divIcon({ className:"", html:'<div class="me"></div>', iconSize:[22,22], iconAnchor:[11,11] }), zIndexOffset:1000 }).addTo(map);
  else me.setLatLng(myLL);
  if (!centered){ centered = true; map.setView(myLL, 16); }
}
function locate(){
  if (!navigator.geolocation){ say("Location isn't available"); return; }
  if (myLL){ map.setView(myLL, 16); return; }
  navigator.geolocation.watchPosition(showMe,
    () => say("Allow location to see bathrooms near you"),
    { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}

document.querySelectorAll(".bar button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".bar button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on"); filter = btn.dataset.f; draw();
});
document.getElementById("locate").onclick = locate;
map.on("moveend", draw);
msg.onclick = () => { if (!toilets.length) load(); };

locate();
load();
</script>
</body>
</html>
