<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA Loo · Find the nearest bathroom in Los Angeles</title>
<meta name="description" content="A simple map of public bathrooms in Los Angeles.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚻</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{
    background:#1c4fa0;color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header h1{margin:0;font-size:16px;font-weight:700;line-height:1.25}
  header h1 span{display:block;font-weight:400;font-size:13px;opacity:.85}
  #locate{
    flex:none;background:#fff;color:#1c4fa0;border:0;border-radius:8px;
    font:inherit;font-weight:700;font-size:14px;padding:9px 12px;cursor:pointer;
  }
  #map{flex:1;min-height:0}
  #msg{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
    background:#fff;color:#10223d;padding:8px 14px;border-radius:20px;font-size:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:1000;white-space:nowrap;display:none;
  }
</style>
</head>
<body>
<header>
  <h1>LA Loo<span>Find the nearest bathroom in Los Angeles</span></h1>
  <button id="locate">📍 Near me</button>
</header>
<div id="map"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const msg = document.getElementById("msg");
function say(t){ msg.textContent = t; msg.style.display = t ? "block" : "none"; }

// Açılışta Venice / LA
const map = L.map("map").setView([33.9850, -118.4695], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors"
}).addTo(map);

const layer = L.layerGroup().addTo(map);
const seen = new Set();
let me = null;

function dirLink(lat, lng){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
}

async function loadToilets(){
  if (map.getZoom() < 13){ say("Zoom in to see bathrooms"); return; }
  const b = map.getBounds();
  const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  const q = `[out:json][timeout:20];(node["amenity"="toilets"](${bbox});way["amenity"="toilets"](${bbox}););out center tags;`;
  say("Loading bathrooms…");
  const servers = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
  ];
  let data = null;
  for (const s of servers){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      const res = await fetch(s + "?data=" + encodeURIComponent(q), { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok){ data = await res.json(); break; }
    }catch(e){ /* sonraki sunucuyu dene */ }
  }
  try{
    if (!data) throw new Error("all servers failed");
    data.elements.forEach(e => {
      if (seen.has(e.id)) return;
      const t = e.tags || {};
      if (t.access === "private") return;
      const lat = e.lat ?? e.center?.lat, lng = e.lon ?? e.center?.lon;
      if (lat == null) return;
      seen.add(e.id);
      const extra = [
        t.fee === "no" ? "Free" : t.fee === "yes" ? "Paid" : "",
        t.access === "customers" ? "Customers only" : "",
        t.opening_hours || ""
      ].filter(Boolean).join(", ");
      L.marker([lat, lng], { icon: L.divIcon({ html:"🚻", className:"", iconSize:[26,26] }) })
        .addTo(layer)
        .bindPopup(`<b>${t.name || "Public restroom"}</b>${extra ? "<br>"+extra : ""}<br><a href="${dirLink(lat,lng)}" target="_blank" rel="noopener">Walk me there</a>`);
    });
    say(seen.size ? "" : "No bathrooms in this area");
  }catch(err){
    say("Couldn't load bathrooms, tap to retry");
  }
}

map.on("moveend", loadToilets);
msg.style.cursor="pointer";
msg.onclick = loadToilets;
loadToilets();

document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation){ say("Location isn't available"); return; }
  say("Finding you…");
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (me) me.setLatLng(ll);
    else me = L.circleMarker(ll, { radius:8, color:"#fff", weight:3, fillColor:"#1c4fa0", fillOpacity:1 }).addTo(map);
    map.setView(ll, 16);
  }, () => say("Allow location to see bathrooms near you"), { enableHighAccuracy:true, timeout:12000 });
};
</script>
</body>
</html>
