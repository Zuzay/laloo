    if (V === "a"){
      const k = prog(t, SC[last] + .7, DUR - 1.3);
      endtag.textContent = t < SC[last] + .7 || k >= 1 ? U.tag : TAGS[Math.min(TAGS.length - 1, Math.floor(k * TAGS.length))];
    } else endtag.textContent = X.endB;
    endtag.classList.toggle("x", /[^\u0000-\u024F\s.,!?'’-]/.test(endtag.textContent));
  }
  V === "a" ? renderA(t) : renderB(t);
}
function renderA(t){
  const pins = app.querySelectorAll(".pin");
  $("#me").style.transform = `translate(-50%,-50%) scale(${pop(t, 3.75)})`;
  pins.forEach((p, i) => p.style.transform = `translate(-50%,-50%) scale(${pop(t, 4.0 + i * .16)})`);
  $("#near").style.background = t > 3.3 && t < 3.8 ? "#133c7c" : "";
  const p1 = fade(t, 7.05, 10.75, .25);
  $("#pop1").style.opacity = p1; $("#pop1").style.transform = `scale(${.85 + .15 * ease(prog(t, 7.05, 7.35))})`;
  const rp = $("#rtp");
  rp.style.opacity = t < 10.8 ? 0 : .9;
  rp.setAttribute("d", partial(ROUTE_A, ease(prog(t, 10.8, 12.0))));
  const shopS = pop(t, 13.7);
  $("#shop").style.transform = `translate(-50%,-50%) scale(${shopS})`;
  const rg = ((t - 13.9) % 1.1) / 1.1;
  $("#ring").style.opacity = t > 13.9 && t < 14.6 ? (1 - rg) : 0;
  $("#ring").style.transform = `translate(-50%,-50%) scale(${1 + rg * 1.4})`;
  const p2 = fade(t, 14.7, 17.6, .25);
  $("#pop2").style.opacity = p2; $("#pop2").style.transform = `scale(${.85 + .15 * ease(prog(t, 14.7, 15.0))})`;
  $("#cbtn").style.background = t > 16.0 && t < 16.4 ? "#fde8e8" : "";
  const toast = $("#toast");
  if (t >= 12.0 && t < 13.6){ toast.textContent = U.mins; toast.style.opacity = fade(t, 12.0, 13.6, .2); }
  else if (t >= 16.3 && t < 17.6){ toast.textContent = U.copied; toast.style.opacity = fade(t, 16.3, 17.6, .2); }
  else toast.style.opacity = 0;
}
function renderB(t){
  const show = (id, a, b) => { $(id).style.opacity = fade(t, a, b, .3); };
  show("#s1", 0, 12.3); show("#s2", 12.0, 15.8); show("#s3", 15.5, 19.8); show("#s4", 19.5, 24.3);
  // Form
  const ti = typed(X.tTitle, t, .6, 2.3), b1 = typed(X.t1, t, 2.4, 3.8), b2 = typed(X.t2, t, 4.7, 7.6);
  const caret = `<span class="caret"></span>`;
  const blink = Math.floor(t * 2.5) % 2 === 0;
  $("#fTitle").innerHTML = esc(ti) + (t > .4 && t < 2.4 && blink ? caret : "");
  $("#fTitle").classList.toggle("on", t > .4 && t < 2.4);
  $("#fBody").innerHTML = esc(b1 + b2) + (t > 2.4 && t < 8 && blink ? caret : "");
  $("#fBody").classList.toggle("on", t > 2.4 && t < 8);
  const micOn = t > 4.4 && t < 7.9;
  $("#mic").classList.toggle("on", micOn); $("#mic").textContent = micOn ? U.stop : U.mic;
  $("#micst").textContent = micOn ? U.listen : "";
  // Yerler bölümüne kaydır
  const sc = ease(prog(t, 8.0, 8.6));
  $("#formscroll").style.transform = `translateY(${-sc * 330}px)`;
  $("#pName").textContent = typed(X.pName, t, 8.5, 9.3); $("#pHood").textContent = typed(X.pHood, t, 9.3, 9.6);
  $("#yes").classList.toggle("on", t > 9.0 && t >= 8.9 + .1);
  $("#pWhere").textContent = typed(X.pWhere, t, 10.0, 11.4);
  $("#pWhere").classList.toggle("on", t > 9.9 && t < 12);
  // Önizleme
  $("#sendbtn").style.background = t > 14.6 && t < 15 ? "#133c7c" : "";
  $("#thx").style.opacity = fade(t, 15.0, 15.9, .2);
  // Harita
  app.querySelectorAll("#s3 .pin").forEach((p, i) => p.style.transform = `translate(-50%,-50%) scale(${pop(t, 15.9 + i * .3)})`);
  $("#rtp").style.opacity = t > 16.5 ? 1 : 0;
  $("#rtp").setAttribute("d", partial(ROUTE_B, ease(prog(t, 16.5, 17.8))));
  $("#pop3").style.opacity = fade(t, 18.0, 19.8, .25); $("#pop3").style.transform = `scale(${.85 + .15 * ease(prog(t, 18.0, 18.3))})`;
  // Katılım
  const n = t < 20.2 ? 36 : 37;
  $("#cnum").textContent = n; $("#cbar").style.width = (36 + ease(prog(t, 20.2, 20.8))) + "%";
  const bd = ease(prog(t, 21.5, 22.0));
  $("#bdg").style.opacity = bd; $("#bdg").style.transform = `rotate(${-2 - (1 - bd) * 14}deg) scale(${.8 + .2 * bd})`;
}

// ================= SES (dosyalar eklenince kendiliğinden açılır) =================
// Dosya adı: /tour/audio/<a|b>-<dil>-<sahne no>.mp3  (ör. a-en-1.mp3). Yoksa ses düğmesi görünmez.
let soundOn = false, audio = null;
function onScene(s){
  if (!soundOn) return;
  try{ if (audio) audio.pause(); audio = new Audio(`audio/${V}-${LANG}-${s + 1}.mp3`); audio.play().catch(() => {}); }catch(e){}
}
fetch(`audio/${V}-${LANG}-1.mp3`, { method:"HEAD" }).then(r => { if (r.ok) $("#snd").hidden = false; }).catch(() => {});
$("#snd").onclick = () => { soundOn = !soundOn; $("#snd").textContent = soundOn ? "🔊" : "🔇"; if (!soundOn && audio) audio.pause(); else { lastScene = -1; } };

// ================= OYNATMA =================
function fit(){
  const w = innerWidth, h = innerHeight, k = Math.min(w / 1080, h / 1920);
  const st = $("#stage"); st.style.transform = `scale(${k})`;
  st.style.left = Math.round((w - 1080 * k) / 2) + "px"; st.style.top = Math.round((h - 1920 * k) / 2) + "px";
}
addEventListener("resize", fit); fit();
let t0 = null, paused = false, pausedAt = 0;
window.__render = t => render(t);            // video kaydı için: kare kare çizim
window.__dur = DUR;
function loop(now){
  if (!paused){
    if (t0 === null) t0 = now;
    let t = (now - t0) / 1000;
    if (t >= DUR){ t0 = now; t = 0; lastScene = -1; }
    render(t);
  }
  requestAnimationFrame(loop);
}
$("#pp").onclick = () => {
  if (paused){ t0 = performance.now() - pausedAt * 1000; paused = false; $("#pp").textContent = "❚❚"; }
  else { pausedAt = (performance.now() - t0) / 1000; paused = true; $("#pp").textContent = "▶"; }
};
$("#rs").onclick = () => { t0 = performance.now(); paused = false; lastScene = -1; $("#pp").textContent = "❚❚"; };
$("#other").href = V === "a" ? "?v=stories" : "?v=map";
$("#other").textContent = V === "a" ? "📖 Stories ▶" : "📍 Map ▶";
if (Q.has("rec")) render(0);
else document.fonts.ready.then(() => requestAnimationFrame(loop));
</script>
